models:
  - name: stg_observations
    description: Observation data with basic cleaning and transformation applied, one row per observation.
    columns:
      - name: observation_id
        description: The unique key for each observation.
        data_tests:
          - not_null
          - unique
      - name: patient_id
        description: The unique key for stg_patients.
        data_tests:
          - not_null
      - name: encounter_id
        description: The unique key for stg_encounters.